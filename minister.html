<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minister Share Entry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="minister.css">
</head>

<body>

    <div class="container">
        <h1><i class="fas fa-shield-alt"></i> Minister Share Entry</h1>

        <div class="minister-box">
            <label for="minister1">Minister 1 Share:</label>
            <input type="number" id="minister1" placeholder="Enter secret share">
        </div>
        <div class="minister-box">
            <label for="minister2">Minister 2 Share:</label>
            <input type="number" id="minister2" placeholder="Enter secret share">
        </div>
        <div class="minister-box">
            <label for="minister3">Minister 3 Share:</label>
            <input type="number" id="minister3" placeholder="Enter secret share">
        </div>
        <div class="minister-box">
            <label for="minister4">Minister 4 Share:</label>
            <input type="number" id="minister4" placeholder="Enter secret share">
        </div>
        <div class="minister-box">
            <label for="minister5">Minister 5 Share:</label>
            <input type="number" id="minister5" placeholder="Enter secret share">
        </div>
        <div class="actions">
            <button id="submitSharesBtn"><i class="fas fa-paper-plane"></i> Submit All Shares</button>
            <button id="abortLaunchBtn" style="background-color: #d9534f; margin-left: 10px;"><i class="fas fa-ban"></i>
                Abort Launch</button>
        </div>
    </div>

    <script src="minister.js"></script>
</body>

</html>
